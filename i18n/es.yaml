legalNoticeHeader: "Aviso legal"
legalNotice: |
             Este sitio ofrece información para ayudar a a famliares y amigos de personas con TOC a comprender mejor el trastorno.
             **No sustituye el diagnóstico ni el consejo de profesionales de la salud**.
             Si crees que tu familiar o amigo necesita ayuda, consulta con un médico de familia (pediatra en el caso de menores) o
             acude directamente a un psicólogo especialista en TOC o a un psiquiatra.
             Para los casos más graves acude a las urgencias de psiquiatría de vuestro hospital de referencia o llama al **112**.

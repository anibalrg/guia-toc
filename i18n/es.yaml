legalNoticeHeader: "Aviso legal"
legalNotice: |
             El propósito de este sitio es ofrecer información para ayudar a famliares y amigos de personas con TOC a comprender mejor el trastorno.
             En ningún caso es sustituir el diagnóstico ni la información proporcionada por profesionales especializados con el TOC.
             Si crees que tu familiar o amigo necesita ayuda, consulta con tu médico de familia (pediatra en el caso de menores) o
             acude directamente a un psicólogo especialista en TOC o a un psiquiatra.
             Para los casos más graves acude a las urgencias de psiquiatría de vuestro hospital de referencia o llama al **112**.
